<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1228.8" viewBox="0 0 2048 1228.8" role="img" aria-describedby="desc">
  <desc id="desc">两边都从各自的包目录按顺序加载代码入口。网关沿用清单中的入口列表。AgentServer 按包内依赖排好入口列表，连同包目录放进加载计划。两侧各自登记处理函数、分发业务事件和调用 Ops，Web Client 接收界面数据并显示扩展界面。</desc>
  <metadata>视觉参考：JiuwenSwarm架构扩展方案(3).pptx 第5页。实现：jiuwenswarm 06f70e487e2d478febd621e1b5970a06d4c5c920、agent-core d4c02c6c52dda8e027af1a08295c5db7f4297fe4。</metadata>
  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #111827; }
    .section { font-size: 27px; font-weight: 700; }
    .head { font-size: 24px; font-weight: 700; }
    .detail { font-size: 19px; fill: #495c75; }
    .small { font-size: 18px; fill: #334155; }
    .data-title { font-size: 21px; font-weight: 700; fill: #0f3d5e; }
    .data-tag { font-size: 16px; font-weight: 700; fill: #fff; }
    .blue-label { font-size: 17px; font-weight: 700; fill: #1d4ed8; }
    .call-label { font-size: 17px; font-weight: 700; fill: #9a3412; }
    .pill { font-size: 18px; font-weight: 700; }
    .arrow { fill: none; stroke-width: 2.7px; stroke-linecap: round; stroke-linejoin: round; }
  </style>
