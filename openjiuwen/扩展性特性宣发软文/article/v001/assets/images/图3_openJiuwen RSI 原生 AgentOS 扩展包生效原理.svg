  <text x="1138.0" y="641" class="detail" text-anchor="middle">创建扩展实例</text>
  <text x="1138.0" y="666" class="detail" text-anchor="middle">读取扩展要响应的事件</text>
  <text x="1138.0" y="691" class="detail" text-anchor="middle">收集匹配条件和函数</text>
  <rect x="1306" y="575" width="228" height="143" rx="14" fill="#fff" stroke="#4ade80" stroke-width="1.65"/>
  <text x="1420.0" y="614" class="head" text-anchor="middle">按扩展包登记</text>
