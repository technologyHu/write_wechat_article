  <text x="1279.0" y="900" class="detail" text-anchor="middle">组件发出事件，各自的总线调用匹配的处理函数</text>
  <text x="1279.0" y="931" class="detail" text-anchor="middle">处理函数可参与当前流程，也能通过 Ops 调用组件能力</text>
  <text x="1279.0" y="962" class="detail" text-anchor="middle">需要更新界面时，可向 Web Client 发送界面数据</text>
