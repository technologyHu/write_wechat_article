  <text x="83" y="99" class="section" text-anchor="start">① 扩展包管理</text>
  <rect x="497" y="42" width="394" height="1071" rx="22" fill="#fffaf5" stroke="#fdba74" stroke-width="2" stroke-dasharray="9 7"/>
  <rect x="520" y="64" width="268" height="51" rx="26" fill="#ffedd5" stroke="none" stroke-width="1.6"/>
