  <text x="1822.5" y="464" class="head" text-anchor="middle">Gateway 网关</text>
  <text x="1822.5" y="496" class="detail" text-anchor="middle">处理请求的放行与转发</text>
  <text x="1822.5" y="528" class="detail" text-anchor="middle">支持扩展应用入口界面</text>
