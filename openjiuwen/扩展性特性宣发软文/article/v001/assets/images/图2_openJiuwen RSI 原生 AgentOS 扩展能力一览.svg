  <title id="title">JiuwenSwarm V2 扩展能力一览</title>
  <desc id="description">左侧展示扩展包目录和 通用扩展包清单示例。清单中的界面贡献指向 Web，后端运行域为 Gateway 或 AgentServer。右侧按 Client、Gateway、AgentServer、Swarm、Agent 五层列出模块，Swarm 和 Agent 由 AgentServer 接入。</desc>
