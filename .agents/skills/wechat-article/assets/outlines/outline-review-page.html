  <script>
    if (document.documentElement.dataset.outlineDelivery === "local") {
      window.sendOutlineReview = async (message) => {
        let response;
        let result;
        try {
          response = await fetch("feedback", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: message,
            signal: AbortSignal.timeout(25000),
          });
          result = await response.json();
        } catch {
          throw new Error("送达状态待确认，请先查看原对话。");
        }
        if (!response.ok) throw new Error(result.error);
        if (result.status !== "queued") throw new Error("送达状态待确认，请先查看原对话。");
      };
      document.addEventListener("DOMContentLoaded", () => {
        const { review_id: shownReview } = JSON.parse(document.querySelector("[data-review]").textContent);
        let connected = true;
        const setConnected = (value) => {
          if (connected === value) return;
          connected = value;
          document.dispatchEvent(new CustomEvent("outline-review:connection", { detail: connected }));
        };
        async function checkCurrentReview() {
          try {
            const response = await fetch("current", { signal: AbortSignal.timeout(3000) });
            if (!response.ok) throw new Error("review unavailable");
            const current = await response.json();
            setConnected(true);
            if (current.review_id !== shownReview) {
              const reload = document.dispatchEvent(new Event("outline-review:next-round", { cancelable: true }));
              if (reload) {
                location.reload();
                return;
              }
            }
          } catch {
            setConnected(false);
          }
          setTimeout(checkCurrentReview, 2000);
        }
        setTimeout(checkCurrentReview, 2000);
      });
    }
  </script>
